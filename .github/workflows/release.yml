name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  pages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-26
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    env:
      APP_BUNDLE: Aevium.app
      DIST_PATH: ${{ github.workspace }}/dist
      PROJECT_PATH: Aevium.xcodeproj
      SCHEME: Aevium
      SPARKLE_VERSION: 2.9.2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Sync version metadata to tag
        run: ./scripts/set_version.sh "${GITHUB_REF_NAME#v}"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT_PATH" -scheme "$SCHEME"

      - name: Download Sparkle release tools
        run: |
          TOOLS_DIR="$(./scripts/download_sparkle_tools.sh "$SPARKLE_VERSION" "$RUNNER_TEMP/sparkle-tools")"
          echo "AEVIUM_SPARKLE_TOOLS_DIR=$TOOLS_DIR" >> "$GITHUB_ENV"

      - name: Prepare Sparkle private key
        env:
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
        run: |
          SPARKLE_KEY_PATH="$RUNNER_TEMP/sparkle-private-key"
          echo -n "$SPARKLE_PRIVATE_KEY_BASE64" | base64 --decode > "$SPARKLE_KEY_PATH"
          chmod 600 "$SPARKLE_KEY_PATH"
          echo "AEVIUM_SPARKLE_PRIVATE_KEY_PATH=$SPARKLE_KEY_PATH" >> "$GITHUB_ENV"

      - name: Build unsigned release app
        run: |
          DERIVED_DATA_PATH="$RUNNER_TEMP/DerivedData"
          RELEASE_APP_PATH="$RUNNER_TEMP/Aevium.app"

          xcodebuild build \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          rm -rf "$RELEASE_APP_PATH"
          cp -R "$DERIVED_DATA_PATH/Build/Products/Release/$APP_BUNDLE" "$RELEASE_APP_PATH"
          echo "AEVIUM_RELEASE_APP_PATH=$RELEASE_APP_PATH" >> "$GITHUB_ENV"

      - name: Package release artifacts
        run: |
          mkdir -p "$DIST_PATH"
          ./scripts/create_dmg.sh "$AEVIUM_RELEASE_APP_PATH" "$DIST_PATH/Aevium.dmg"
          ./scripts/create_zip.sh "$AEVIUM_RELEASE_APP_PATH" "$DIST_PATH/Aevium.zip"

      - name: Generate release notes
        run: ./scripts/generate_release_notes.sh "${GITHUB_REF_NAME#v}" "$DIST_PATH/release-notes.md"

      - name: Generate Sparkle appcast
        run: ./scripts/generate_appcast.sh "${GITHUB_REF_NAME#v}" "$DIST_PATH/Aevium.zip" "$DIST_PATH/release-notes.md" "$DIST_PATH/appcast.xml"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "$DIST_PATH/Aevium.zip" \
            "$DIST_PATH/Aevium.dmg" \
            --title "Aevium ${GITHUB_REF_NAME#v}" \
            --notes-file "$DIST_PATH/release-notes.md"

      - name: Prepare GitHub Pages payload
        run: |
          mkdir -p site/release-notes
          cp "$DIST_PATH/appcast.xml" site/appcast.xml
          cp "$DIST_PATH/release-notes.md" "site/release-notes/${GITHUB_REF_NAME}.md"
          touch site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4
